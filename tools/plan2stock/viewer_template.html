<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backa 3D – floor plans to material stock</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f2ee;--ink:#1d1d1b;--mut:#6b6a66;--line:#d9d5cc;--acc:#2f6f8f;--card:#fff}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg)}
#app{display:grid;grid-template-columns:1fr 360px;height:100vh}
#view{position:relative;overflow:hidden}
canvas{display:block}
#side{border-left:1px solid var(--line);background:var(--card);overflow:auto;padding:18px 18px 40px}
h1{font-size:17px;margin:0 0 4px;font-weight:600}h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:20px 0 8px;font-weight:600}
p.s{margin:0;color:var(--mut);font-size:12.5px;line-height:1.45}
table{width:100%;border-collapse:collapse;font-size:12.5px}td{padding:4px 0;border-bottom:1px solid #eee}td.n{text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
td.src{color:var(--mut);font-size:11px;text-align:right;padding-left:8px}
.ctl{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12.5px;display:flex;flex-direction:column;gap:6px;max-width:260px}
.ctl label{display:flex;gap:6px;align-items:center;cursor:pointer}
.leg{position:absolute;left:12px;bottom:12px;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:11.5px;display:flex;flex-wrap:wrap;gap:10px;max-width:60%}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.unit{border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin:6px 0;font-size:12.5px;cursor:pointer}
.unit:hover{border-color:var(--acc)}
.g{display:inline-block;font-size:10.5px;font-weight:600;border-radius:3px;padding:1px 5px;margin-left:6px}
.gA{background:#dcefe1;color:#1d6b35}.gB{background:#fbf0d2;color:#80600f}.gC{background:#f6dad7;color:#8d2a1f}
a{color:var(--acc)}
.tip{position:absolute;pointer-events:none;background:#1d1d1b;color:#fff;font-size:12px;padding:4px 7px;border-radius:4px;display:none;white-space:nowrap}
select{font:inherit;padding:3px}
</style>
</head>
<body>
<div id="app">
 <div id="view">
  <div class="ctl">
   <b>Backa · Hisingen</b>
   <label><input type="checkbox" id="ctx" checked> Context buildings</label>
   <label><input type="checkbox" id="cut"> Cut away floors above measured units</label>
   <label><input type="checkbox" id="explode"> Explode floors</label>
   <label><input type="checkbox" id="pins" checked> Listings without a mapped building</label>
   <label>Go to <select id="goto"><option value="">building…</option></select></label>
  </div>
  <div class="leg">
   <span><i class="sw" style="background:#e3b48f"></i>Listing building, floor without plan</span>
   <span><i class="sw" style="background:#3d3a35"></i>Walls from plan</span>
   <span><i class="sw" style="background:#7fb7d6"></i>Window</span>
   <span><i class="sw" style="background:#a0703f"></i>Door</span>
   <span><i class="sw" style="background:#d65a3a"></i>Appliance (detected)</span>
   <span><i class="sw" style="background:#dcd9d2"></i>Context</span>
  </div>
  <div class="tip" id="tip"></div>
 </div>
 <div id="side"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const M = /*DATA*/null;
const FH = 2.9, WALL_H = 2.6;
const view = document.getElementById('view'), side = document.getElementById('side'), tip = document.getElementById('tip');
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
view.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xf4f2ee);
const cam = new THREE.PerspectiveCamera(40,1,1,20000);
const ctl = new THREE.OrbitControls(cam, renderer.domElement); ctl.enableDamping = true; ctl.maxPolarAngle = Math.PI*0.49;
scene.add(new THREE.HemisphereLight(0xffffff,0xb8b2a6,0.85));
const sun = new THREE.DirectionalLight(0xffffff,0.75); sun.position.set(-400,700,300); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048); Object.assign(sun.shadow.camera,{left:-900,right:900,top:900,bottom:-900,far:3000}); scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(6000,6000), new THREE.MeshLambertMaterial({color:0xeae7e0}));
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);
// boundary
{const pts=M.boundary.map(p=>new THREE.Vector3(p[0],0.3,-p[1]));const ln=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineDashedMaterial({color:0x2f6f8f,dashSize:8,gapSize:6}));ln.computeLineDistances();scene.add(ln);}

const mat = {
 ctx:new THREE.MeshLambertMaterial({color:0xdcd9d2}),
 solid:new THREE.MeshLambertMaterial({color:0xe3b48f}),
 solidT:new THREE.MeshLambertMaterial({color:0xe7e2d6,transparent:true,opacity:0.22,depthWrite:false}),
 slab:new THREE.MeshLambertMaterial({color:0xd8d2c4}),
 wall:new THREE.MeshLambertMaterial({color:0x3d3a35}),
 glass:new THREE.MeshLambertMaterial({color:0x7fb7d6,transparent:true,opacity:0.8}),
 door:new THREE.MeshLambertMaterial({color:0xa0703f}),
 appl:new THREE.MeshLambertMaterial({color:0xd65a3a}),
 floorU:new THREE.MeshLambertMaterial({color:0xf3ece0}),
 hl:new THREE.MeshLambertMaterial({color:0x2f6f8f,transparent:true,opacity:0.35,depthWrite:false}),
};
function shapeOf(ring, holes){
 const s=new THREE.Shape(ring.map(p=>new THREE.Vector2(p[0],p[1])));
 (holes||[]).forEach(h=>s.holes.push(new THREE.Path(h.map(p=>new THREE.Vector2(p[0],p[1])))));
 return s;
}
function extrude(ring, h, m, holes){
 const g=new THREE.ExtrudeGeometry(shapeOf(ring,holes),{depth:h,bevelEnabled:false});
 g.rotateX(-Math.PI/2); const o=new THREE.Mesh(g,m); o.castShadow=o.receiveShadow=true; return o;
}
// context
const ctxGroup=new THREE.Group(); scene.add(ctxGroup);
{const geoms=[];M.context.forEach(c=>{try{const g=new THREE.ExtrudeGeometry(shapeOf(c.slice(2)),{depth:c[0],bevelEnabled:false});g.rotateX(-Math.PI/2);geoms.push(g)}catch(e){}});
 // merge manually for perf
 let n=0;geoms.forEach(g=>n+=g.attributes.position.count);
 const pos=new Float32Array(n*3),nor=new Float32Array(n*3);let o=0;
 geoms.forEach(g=>{const gg=g.index?g.toNonIndexed():g;gg.computeVertexNormals();pos.set(gg.attributes.position.array,o*3);nor.set(gg.attributes.normal.array,o*3);o+=gg.attributes.position.count});
 const bg=new THREE.BufferGeometry();bg.setAttribute('position',new THREE.BufferAttribute(pos.slice(0,o*3),3));bg.setAttribute('normal',new THREE.BufferAttribute(nor.slice(0,o*3),3));
 const m=new THREE.Mesh(bg,mat.ctx);m.castShadow=m.receiveShadow=true;ctxGroup.add(m);}

// oriented bounding box of a ring
function obb(ring){let best=null;
 for(let i=0;i<ring.length-1;i++){const a=Math.atan2(ring[i+1][1]-ring[i][1],ring[i+1][0]-ring[i][0]);const c=Math.cos(-a),s=Math.sin(-a);
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;ring.forEach(p=>{const x=p[0]*c-p[1]*s,y=p[0]*s+p[1]*c;x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)});
  const A=(x1-x0)*(y1-y0);if(!best||A<best.A)best={A,a,x0,x1,y0,y1}}
 let {a,x0,x1,y0,y1}=best; if(y1-y0>x1-x0){a+=Math.PI/2;[x0,x1,y0,y1]=[-y1,-y0,x0,x1];}
 const cx=(x0+x1)/2,cy=(y0+y1)/2,c=Math.cos(a),s=Math.sin(a);
 return {a,len:x1-x0,dep:y1-y0,cx:cx*c-cy*s,cy:cx*s+cy*c};
}
// build a unit mesh group in local metres, centred, x along long axis
function unitMesh(pl){
 const g=new THREE.Group();
 const xs=pl.outline.map(p=>p[0]),ys=pl.outline.map(p=>p[1]);
 const cx=(Math.min(...xs)+Math.max(...xs))/2,cy=(Math.min(...ys)+Math.max(...ys))/2;
 const rot=(Math.max(...ys)-Math.min(...ys))>(Math.max(...xs)-Math.min(...xs));
 const T=p=>{let x=p[0]-cx,y=-(p[1]-cy);if(rot)[x,y]=[-y,x];return [x,y]};
 try{const f=extrude(pl.outline.map(T),0.05,mat.floorU);g.add(f)}catch(e){}
 pl.walls.forEach(w=>{try{g.add(extrude(w[0].map(T),WALL_H,mat.wall,w.slice(1).map(h=>h.map(T))))}catch(e){}});
 pl.openings.forEach(o=>{const [x,y]=T([o.x,o.y]);let hz=o.horiz;if(rot)hz=!hz;
  const L=o.len,isW=o.kind==='window';const geo=new THREE.BoxGeometry(hz?L:pl.t*1.2,isW?1.3:2.1,hz?pl.t*1.2:L);
  const m=new THREE.Mesh(geo,isW?mat.glass:mat.door);m.position.set(x,isW?0.9+0.65:1.05,-y);g.add(m)});
 pl.swings.forEach(s=>{const [x,y]=T([s.x,s.y]);const m=new THREE.Mesh(new THREE.BoxGeometry(0.06,2.05,0.85),mat.door);m.position.set(x,1.03,-y);g.add(m)});
 pl.appl.forEach(a=>{const [x,y]=T([a.x,a.y]);const tall=/fridge|freezer/.test(a.kind);const m=new THREE.Mesh(new THREE.BoxGeometry(0.6,tall?1.85:0.85,0.6),mat.appl);m.position.set(x,(tall?1.85:0.85)/2,-y);m.userData.tip=a.kind.replace('_',' ');g.add(m)});
 const w=rot?(Math.max(...ys)-Math.min(...ys)):(Math.max(...xs)-Math.min(...xs));
 return {g,w};
}
const umap=Object.fromEntries(M.units.map(u=>[u.id,u]));
const blds=[], pickables=[];
M.buildings.forEach((b,bi)=>{
 const grp=new THREE.Group(); scene.add(grp); b.grp=grp; b.floors=[];
 const o=obb(b.ring);
 const units=[...new Set(b.units)].map(i=>umap[i]);
 const byFloor={};units.forEach(u=>{let f=parseInt(u.floor);if(isNaN(f))f=1;f=Math.max(0,Math.min(f,b.levels-1));(byFloor[f]=byFloor[f]||[]).push(u)});
 // unique plan per floor
 for(let f=0;f<b.levels;f++){
  const fg=new THREE.Group(); fg.position.y=f*FH; grp.add(fg); b.floors.push(fg);
  const list=(byFloor[f]||[]).filter((u,i,a)=>u.inv&&M.plans[u.grp]&&a.findIndex(v=>v.grp===u.grp)===i);
  if(list.length){
   fg.add(extrude(b.ring,0.25,mat.slab));
   const shell=extrude(b.ring,FH-0.25,mat.solidT);shell.position.y=0.25;fg.add(shell);
   let cursor=-o.len/2; const meshes=list.map(u=>({u,...unitMesh(M.plans[u.grp])}));
   const total=meshes.reduce((s,m)=>s+m.w,0)+1*(meshes.length-1); cursor=-Math.min(total,o.len)/2;
   meshes.forEach(m=>{const holder=new THREE.Group();holder.add(m.g);
    m.g.position.x=cursor+m.w/2; cursor+=m.w+1;
    holder.rotation.y=o.a; holder.position.set(o.cx,0.25,-o.cy); fg.add(holder);
    m.g.traverse(c=>{if(c.isMesh){c.userData.unit=m.u.id;c.userData.bld=bi;pickables.push(c)}});
   });
   fg.userData.measured=true;
  } else {
   const s=extrude(b.ring,FH-0.02,mat.solid);fg.add(s);s.userData.bld=bi;pickables.push(s);
  }
 }
 const roof=extrude(b.ring,0.4,mat.slab);roof.position.y=b.levels*FH;grp.add(roof);roof.userData.bld=bi;pickables.push(roof);
 b.center=[o.cx,o.cy];
 const op=document.createElement('option');op.value=bi;op.textContent=(b.address[0]||b.key)+(b.address.length>1?' +'+(b.address.length-1):'');document.getElementById('goto').appendChild(op);
});
// pins for listings without a building
const pinGroup=new THREE.Group();scene.add(pinGroup);
const pinMat=new THREE.MeshLambertMaterial({color:0x2f6f8f});
const pinned={};M.units.filter(u=>u.pin).forEach(u=>{const k=u.pin.join();(pinned[k]=pinned[k]||[]).push(u)});
Object.values(pinned).forEach(us=>{const [x,y]=us[0].pin;const m=new THREE.Mesh(new THREE.CylinderGeometry(1.2,1.2,14,12),pinMat);m.position.set(x,7,-y);m.userData.pin=us.map(u=>u.id);pinGroup.add(m);pickables.push(m)});

function fit(){const r=view.getBoundingClientRect();renderer.setSize(r.width,r.height);cam.aspect=r.width/r.height;cam.updateProjectionMatrix()}
addEventListener('resize',fit);fit();
cam.position.set(-250,420,520);ctl.target.set(0,0,-20);

function applyToggles(){
 ctxGroup.visible=document.getElementById('ctx').checked;
 pinGroup.visible=document.getElementById('pins').checked;
 const cut=document.getElementById('cut').checked, ex=document.getElementById('explode').checked;
 M.buildings.forEach(b=>{const top=Math.max(-1,...b.floors.map((f,i)=>f.userData.measured?i:-1));
  b.floors.forEach((f,i)=>{f.visible=!(cut&&top>=0&&i>top);f.position.y=i*FH*(ex?2.2:1)});
  b.grp.children[b.grp.children.length-1].visible=!(cut&&top>=0);
  b.grp.children[b.grp.children.length-1].position.y=b.levels*FH*(ex?2.2:1);});
}
['ctx','cut','explode','pins'].forEach(id=>document.getElementById(id).onchange=applyToggles);

const fmt=n=>typeof n==='number'?n.toLocaleString('en-GB'):n;
const LBL={windows:'Windows',interior_doors:'Interior doors',entrance_door:'Entrance doors',balcony_door:'Balcony doors',fridge_freezer:'Fridge/freezers',fridge:'Fridges',freezer:'Freezers',stove:'Hobs/stoves',oven:'Ovens',dishwasher:'Dishwashers (on plan)',washing_machine:'Washing machines (on plan)',tumble_dryer:'Tumble dryers',toilet:'Toilets',washbasin:'Washbasins',shower:'Showers',kitchen_sink:'Kitchen sinks',window_area_m2:'Window area, m²',facade_gross_m2:'Façade gross, m²',facade_opaque_m2:'Façade opaque (brick/render/panel), m²',roof_m2:'Roof, m²',slabs_m2:'Floor slabs, m²',interior_wall_area_m2:'Thick interior walls, faces m² (thin partitions not captured)'};
function stockTable(st){return '<table>'+Object.entries(st).filter(([k])=>LBL[k]).map(([k,v])=>`<tr><td>${LBL[k]}</td><td class="n">${fmt(v)}</td></tr>`).join('')+'</table>'}
function overview(){
 const tot={};M.buildings.forEach(b=>Object.entries(b.stock).forEach(([k,v])=>tot[k]=(tot[k]||0)+v));
 const placed=M.units.filter(u=>u.bld).length, grades={};M.units.forEach(u=>grades[u.grade]=(grades[u.grade]||0)+1);
 const types=new Set(M.units.filter(u=>u.inv).map(u=>u.grp)).size;
 const unplaced=M.units.filter(u=>!u.bld);
 const byAddr={};unplaced.forEach(u=>byAddr[u.address]=(byAddr[u.address]||0)+1);
 side.innerHTML=`<h1>Backa pilot: floor plans → 3D → material stock</h1>
 <p class="s">${M.units.length} Boplats listings in Backa, ${types} distinct floor plans vectorised. ${placed} listings placed on ${M.buildings.length} buildings; floors without a plan are solid. ${M.context.length.toLocaleString()} surrounding buildings from your EUBUCCO layer for context.</p>
 <h2>Estimated stock · ${M.buildings.length} buildings, ~${fmt(M.buildings.reduce((s,b)=>s+b.est_units,0))} flats</h2>
 ${stockTable(tot)}
 <p class="s" style="margin-top:8px">Whole-building figures scale the measured flats by the building's estimated flat count (78% of gross floor area ÷ mean listed flat size). Façade = perimeter × height; opaque share = façade minus window area. The material (brick vs render) is not in the data yet.</p>
 <h2>Plan reading quality</h2>
 <p class="s">A: ${grades.A||0} · B: ${grades.B||0} · C: ${grades.C||0} (C = counts fall back to rules) · no plan: ${grades.none||0}</p>
 <h2>Not placed yet (${unplaced.length})</h2>
 <p class="s">${Object.entries(byAddr).map(([a,n])=>`${a} (${n})`).join(' · ')}</p>
 <p class="s" style="margin-top:8px">Click a building or a flat in the model.</p>`;
}
function showBuilding(bi){
 const b=M.buildings[bi];
 const us=[...new Set(b.units)].map(i=>umap[i]);
 side.innerHTML=`<a href="#" id="back">← All of Backa</a><h1 style="margin-top:10px">${b.address.join(', ')}</h1>
 <p class="s">${b.levels} storeys · ${b.height_m} m · footprint ${fmt(b.footprint_m2)} m² · source: ${b.src}${b.tags.year?' · built '+b.tags.year:''}${b.tags.eclass?' · energy class '+b.tags.eclass:''}</p>
 <p class="s">${b.measured_unit_types} plan type(s) measured · ~${b.est_units} flats estimated</p>
 <h2>Estimated building stock</h2>${stockTable(b.stock)}
 <h2>Listings here (${us.length})</h2>`+us.map(u=>`<div class="unit" data-u="${u.id}">${u.rooms} rok · ${u.m2} m² · floor ${u.floor}/${u.floors} · ${fmt(u.rent)} kr<span class="g g${u.grade}">${u.grade}</span><br><span class="s">${u.address} · ${u.placement}</span></div>`).join('');
 document.getElementById('back').onclick=e=>{e.preventDefault();overview()};
 side.querySelectorAll('.unit').forEach(d=>d.onclick=()=>showUnit(d.dataset.u));
 const [x,y]=b.center; ctl.target.set(x,b.levels*FH/2,-y); cam.position.set(x-60,b.levels*FH+70,-y+90);
}
function showUnit(id){
 const u=umap[id];const b=M.buildings.findIndex(x=>x.key===u.bld);
 const inv=u.inv||{};
 side.innerHTML=`<a href="#" id="back">← ${b>=0?'Building':'All of Backa'}</a><h1 style="margin-top:10px">${u.address}</h1>
 <p class="s">${u.rooms} rok · ${u.m2} m² · floor ${u.floor} of ${u.floors} · ${fmt(u.rent)} kr/month · plan quality <span class="g g${u.grade}">${u.grade}</span></p>
 <p class="s"><a href="${u.url}">Open the Boplats listing</a> · plan image ${u.img}</p>
 <h2>Flat inventory</h2><table>`+Object.entries(inv).map(([k,v])=>typeof v==='object'?`<tr><td>${LBL[k]||k.replace(/_/g,' ')}</td><td class="n">${v.n}</td><td class="src">${v.src}</td></tr>`:`<tr><td>${k.replace(/_/g,' ').replace(' m2',' m²').replace(' m',' (m)')}</td><td class="n">${v}</td><td></td></tr>`).join('')+`</table>`;
 document.getElementById('back').onclick=e=>{e.preventDefault();b>=0?showBuilding(b):overview()};
}
document.getElementById('goto').onchange=e=>{if(e.target.value!=='')showBuilding(+e.target.value)};
// picking
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();let down=null;
renderer.domElement.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);
function hit(e){const r=renderer.domElement.getBoundingClientRect();mouse.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(mouse,cam);
 return ray.intersectObjects(pickables.filter(p=>{let o=p;while(o){if(!o.visible)return false;o=o.parent}return true}),false)[0]}
renderer.domElement.addEventListener('pointerup',e=>{if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>4)return;const h=hit(e);if(!h)return;const d=h.object.userData;
 if(d.unit)showUnit(d.unit);else if(d.bld!==undefined)showBuilding(d.bld);else if(d.pin){const u=umap[d.pin[0]];side.innerHTML=`<a href="#" id="back">← All of Backa</a><h1 style="margin-top:10px">${u.address}</h1><p class="s">${d.pin.length} listing(s). The address point is known but the building isn't in OpenStreetMap or EUBUCCO yet (new build).</p>`+d.pin.map(i=>umap[i]).map(u=>`<div class="unit" data-u="${u.id}">${u.rooms} rok · ${u.m2} m² · floor ${u.floor}/${u.floors}<span class="g g${u.grade}">${u.grade}</span></div>`).join('');document.getElementById('back').onclick=e=>{e.preventDefault();overview()};side.querySelectorAll('.unit').forEach(x=>x.onclick=()=>showUnit(x.dataset.u))}});
renderer.domElement.addEventListener('pointermove',e=>{const h=hit(e);if(h&&(h.object.userData.tip||h.object.userData.unit)){const d=h.object.userData;tip.style.display='block';tip.textContent=d.tip||(umap[d.unit].address+' · '+umap[d.unit].rooms+' rok, '+umap[d.unit].m2+' m²');const r=view.getBoundingClientRect();tip.style.left=(e.clientX-r.left+12)+'px';tip.style.top=(e.clientY-r.top+12)+'px'}else tip.style.display='none'});
overview();applyToggles();
(function loop(){requestAnimationFrame(loop);ctl.update();renderer.render(scene,cam)})();
</script>
</body>
</html>
