# Single-origin reverse proxy for the production build.
#
# One origin serves everything, so all the (now relative) app + viewer URLs work
# both locally and behind a server/domain:
#   /            -> the built React SPA (with client-side routing fallback)
#   /gothenburg_3d.html, /viewer/js/*, *.css, *.meta.js, *.json  -> viewer assets
#   /api/*       -> the FastAPI backend
#
# Cesium loads from its CDN (see gothenburg_3d.html), so it needs no local serving.

upstream backend {
    server backend:8000;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Large payloads (building batches, uploads)
    client_max_body_size 32m;
    # Big JSON (buildings.json ~55MB, dtcc_vegetation.json ~53MB) — allow slow first loads
    proxy_read_timeout 300s;
    sendfile on;

    # API -> backend
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;      # long EPSM simulations
    }

    # The SPA's content-hashed bundles never change under a given name → cache hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything else (index.html, the 3D viewer HTML/JS/CSS, and the mounted data
    # files that get refreshed — buildings/vegetation/boplats/terrain) must
    # revalidate, so updates always show on refresh instead of being served stale
    # from the browser cache. ETag makes this a cheap 304 when nothing changed.
    #
    # NOTE: no `$uri/` here — some client-side routes (e.g. /viewer) share a name
    # with a real asset directory in the web root (/viewer/js/…). With `$uri/`,
    # nginx resolves the bare route to that directory and returns 403 (autoindex is
    # off) instead of falling through to index.html. Individual files still serve
    # via `$uri`; only bare directory paths fall through to the SPA.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
