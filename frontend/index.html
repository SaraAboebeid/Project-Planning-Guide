<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital ToolBox</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-slate-50 font-sans antialiased">
    <!-- Set the theme class before React mounts. ThemeToggle applies it in an
         effect, which runs after first paint: with bright as the default that
         showed a dark flash on every load. Same rule as initialMode(). -->
    <script>
      (function () {
        try {
          var saved = window.localStorage.getItem("ppg-theme-mode");
          if (saved !== "dark") document.body.classList.add("bright-mode");
        } catch (e) { document.body.classList.add("bright-mode"); }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
