services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: project-planning-guide:latest
    container_name: ppg-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Mount large datasets read-only — keeps the image small
      - ./data:/app/data:ro
      - ./frontend/public/buildings.json:/app/frontend/public/buildings.json:ro
    restart: unless-stopped
